[build]
  command = "node scripts/build.mjs"
  publish = "public"

# Server code for notifications (netlify/functions/notify.mjs). It needs no npm packages.
[functions]
  directory = "netlify/functions"

# The proxies to the game's public API and the report lookup, and the security headers, depend on public/config.js,
# so scripts/build.mjs writes them as public/_redirects and public/_headers on every deploy. Edit config.js, not this file.
