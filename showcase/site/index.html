<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DONUT, an OGame alliance</title>
  <meta name="description" content="Where DONUT lives in the OGame universe Jishui (USA). Orange planets are ours.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <p class="sys" data-copy="headerLabel"></p>
    <h1 id="title">DONUT</h1>
    <p id="sub"></p>
    <label id="pick-wrap"><span data-copy="pickerLabel"></span> <select id="pick" aria-label="Alliance to show"><option>DONUT</option></select></label>
  </header>
  <section id="recruit" aria-label="Recruiting">
    <p class="sys" data-copy="recruitLabel"></p>
    <h2 data-copy="recruitTitle"></h2>
    <p data-copy="recruitBody"></p>
    <p class="how" data-copy="recruitHow"></p>
  </section>
  <nav id="tabs" aria-label="Galaxy"></nav>
  <main>
    <div id="stage">
      <svg id="svg" role="img" aria-label="Map of the universe. Orange planets belong to the chosen alliance."></svg>
      <div id="legend"><span><i class="o">&#9679;</i> <b id="leg-tag">DONUT</b></span><span><i class="x">&#9679;</i> <span data-copy="legendOthers"></span></span></div>
      <div id="zoomtxt"></div>
      <div id="ctl">
        <button type="button" id="zin" aria-label="Zoom in">+</button>
        <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
        <button type="button" id="zreset" aria-label="Reset" hidden>&#8634;</button>
      </div>
    </div>
    <div id="card" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <section id="members">
    <h2 data-copy="leaderboardTitle"></h2>
    <p class="note" data-copy="leaderboardNote"></p>
    <div id="list"></div>
  </section>
  <footer data-copy="footer"></footer>
  <script src="/copy.js"></script>
  <script src="/map.js"></script>
</body>
</html>
